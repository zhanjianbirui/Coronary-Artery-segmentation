project_name: coronary-seg
seed: 42
data:
  data_root: /path/to/ImageCAS
  split_json: splits/split.json
  cache_rate: 0.0
  num_workers: 8
preprocess:
  a_min: -200.0
  a_max: 800.0
  clip: true
  target_spacing:
  - 0.5
  - 0.5
  - 0.5
  patch_size:
  - 128
  - 128
  - 128
train:
  max_epochs: 250
  batch_size: 2
  samples_per_image: 2
  pos_ratio: 0.8
  lr: 0.0002
  weight_decay: 1.0e-05
  amp: true
  val_interval: 5
  grad_clip: 12.0
model:
  name: segresnet
  in_channels: 1
  out_channels: 2
  channels:
  - 16
  - 32
  - 64
  - 128
  - 256
  strides:
  - 2
  - 2
  - 2
  - 2
  num_res_units: 2
  dropout: 0.0
  init_filters: 32
  blocks_down:
  - 1
  - 2
  - 2
  - 4
  blocks_up:
  - 1
  - 1
  - 1
loss:
  name: dice_ce_cldice
  cldice_weight: 0.5
  cldice_iters: 3
infer:
  sw_batch_size: 4
  overlap: 0.5
  tta: true
  min_component_voxels: 30
output:
  work_dir: runs/exp_a100
